<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Persona OS</title>
<style>
:root{
  --bg:#f3f5f7; --surface:#fff; --ink:#1b2430; --muted:#66717f; --line:#dde2e8; --code-bg:#161b22; --code-ink:#e6edf3;
  --accent:#1f7a5c; --accent-soft:#e3f2ec; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#12161b; --surface:#1a2028; --ink:#e6eaf0; --muted:#8d98a6; --line:#2a323c; --code-bg:#0c1014; --accent-soft:#1c2b26; color-scheme:dark; }
}
body[data-mode="code"]{ --accent:#1f7a5c; }
body[data-mode="think"]{ --accent:#5b4bc4; --accent-soft:#ecebfa; }
body[data-mode="fact"]{ --accent:#a8620a; --accent-soft:#f8eddc; }
@media (prefers-color-scheme:dark){
  body[data-mode="code"]{ --accent:#43c59a; --accent-soft:#1a2b25; }
  body[data-mode="think"]{ --accent:#a79bff; --accent-soft:#232038; }
  body[data-mode="fact"]{ --accent:#f0b35c; --accent-soft:#302617; }
}
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.65 "Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background .2s;
}
header{ border-bottom:1px solid var(--line); background:var(--surface); }
.bar{ max-width:780px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.logo{ font-weight:700; font-size:18px; letter-spacing:-.02em; margin-right:auto; display:flex; align-items:center; gap:8px; }
.logo i{ width:12px; height:12px; border-radius:50%; background:var(--accent); display:inline-block; transition:background .2s; }
.tabs{ display:flex; gap:4px; background:var(--bg); padding:4px; border-radius:12px; border:1px solid var(--line); }
.tab{ border:0; background:none; color:var(--muted); font:inherit; font-size:14px; font-weight:600; padding:6px 16px; border-radius:9px; cursor:pointer; }
.tab[aria-selected="true"]{ background:var(--surface); color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.reset{ border:1px solid var(--line); background:none; color:var(--muted); font:inherit; font-size:13px; padding:6px 12px; border-radius:9px; cursor:pointer; }
button:focus-visible,textarea:focus-visible,summary:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
main{ flex:1; overflow-y:auto; }
.wrap{ max-width:780px; margin:0 auto; padding:24px 16px 8px; }
.empty{ padding:8vh 0 0; }
.empty h1{ font-size:clamp(26px,5vw,38px); line-height:1.25; letter-spacing:-.03em; margin:0 0 8px; max-width:20ch; }
.empty p{ color:var(--muted); margin:0 0 24px; max-width:46ch; }
.chips{ display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
.chip{ text-align:left; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:15px; padding:10px 14px; border-radius:12px; cursor:pointer; }
.chip:hover{ border-color:var(--accent); }
.msg{ margin:0 0 20px; display:flex; }
.msg.user{ justify-content:flex-end; }
.bubble{ max-width:88%; padding:10px 14px; border-radius:16px; overflow-wrap:anywhere; }
.user .bubble{ background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
@media (prefers-color-scheme:dark){ .user .bubble{ color:#0c1014; } }
.ai .bubble{ background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:4px; }
.bubble pre{ background:var(--code-bg); color:var(--code-ink); padding:12px 14px; border-radius:10px; overflow-x:auto; margin:8px 0; font-size:13.5px; line-height:1.55; }
.bubble code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
.bubble :not(pre)>code{ background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:5px; font-size:.92em; }
details{ margin:0 0 8px; border-left:3px solid var(--accent); padding:2px 0 2px 10px; color:var(--muted); font-size:14px; }
summary{ cursor:pointer; font-weight:600; color:var(--accent); }
.dots{ display:inline-flex; gap:4px; padding:4px 0; }
.dots b{ width:6px; height:6px; border-radius:50%; background:var(--muted); animation:blink 1s infinite; }
.dots b:nth-child(2){ animation-delay:.15s; } .dots b:nth-child(3){ animation-delay:.3s; }
@keyframes blink{ 0%,80%,100%{ opacity:.25 } 40%{ opacity:1 } }
@media (prefers-reduced-motion:reduce){ .dots b{ animation:none; opacity:.6; } }
footer{ border-top:1px solid var(--line); background:var(--surface); }
form{ max-width:780px; margin:0 auto; padding:12px 16px; display:flex; gap:10px; align-items:flex-end; }
textarea{ flex:1; resize:none; max-height:160px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 14px; line-height:1.5; }
.send{ border:0; background:var(--accent); color:#fff; font:inherit; font-weight:700; padding:10px 18px; border-radius:12px; cursor:pointer; height:44px; }
@media (prefers-color-scheme:dark){ .send{ color:#0c1014; } }
.send:disabled{ opacity:.45; cursor:default; }
.note{ max-width:780px; margin:0 auto; padding:0 16px 10px; font-size:12px; color:var(--muted); }
</style>
</head>
<body data-mode="code">
<header><div class="bar">
  <div class="logo"><i></i>Persona OS</div>
  <div class="tabs" role="tablist" aria-label="모드 선택" id="tabs"></div>
  <button class="reset" id="reset" type="button">새 대화</button>
</div></header>

<main id="scroll"><div class="wrap" id="chat"></div></main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" aria-label="메시지 입력"></textarea>
    <button class="send" id="send" type="submit">보내기</button>
  </form>
  <div class="note" id="note"></div>
</footer>

<script>
// 모델 서버 주소. 비워 두면 데모 모드로 동작합니다. 예: "https://api.example.com/chat"
const API_URL = "";

const MODES = {
  code:  { label:"코드",  title:"만들고 싶은 코드를 말해 주세요", desc:"실행 가능한 코드와 짧은 설명으로 답합니다.",
           hint:"코드를 요청하세요. Shift+Enter로 줄바꿈",
           examples:["파이썬으로 이진 탐색을 구현해줘","CSV 파일을 읽어서 평균을 구하는 함수 만들어줘"] },
  think: { label:"생각",  title:"어려운 문제를 같이 풀어봐요", desc:"단계별로 추론한 뒤 최종 답을 알려 줍니다.",
           hint:"풀고 싶은 문제를 입력하세요",
           examples:["사과 3개를 2명이 공평하게 나누려면 어떻게 해야 할까?","1부터 100까지 3의 배수이면서 5의 배수가 아닌 수는 몇 개일까?"] },
  fact:  { label:"팩트",  title:"근거가 있는 답만 드려요", desc:"[문서]를 붙여 넣고 질문하면 문서에 근거해 답하고, 근거가 없으면 알 수 없다고 말합니다.",
           hint:"[문서] 내용을 붙여 넣고 [질문]을 이어서 쓰세요",
           examples:["[문서]\n에펠탑은 1889년 파리에 세워졌다.\n\n[질문]\n에펠탑은 언제 세워졌나?"] }
};

let mode = "code";
const history = { code:[], think:[], fact:[] };
let busy = false;

const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), send = $("send");

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function md(s){
  return s.split("```").map((p,i) => i % 2
    ? "<pre><code>" + esc(p.replace(/^[^\n]*\n/, "")) + "</code></pre>"
    : esc(p).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>")
  ).join("");
}

function bubble(role, text, thinking){
  const el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "user" : "ai");
  const think = thinking ? `<details><summary>생각 과정</summary>${md(thinking)}</details>` : "";
  el.innerHTML = `<div class="bubble">${think}${md(text)}</div>`;
  chat.appendChild(el);
  $("scroll").scrollTop = $("scroll").scrollHeight;
  return el;
}

function render(){
  const m = MODES[mode];
  document.body.dataset.mode = mode;
  input.placeholder = m.hint;
  $("note").textContent = API_URL ? "" : "데모 모드입니다. 실제 모델 서버가 연결되지 않았습니다.";
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.mode === mode));
  chat.innerHTML = "";
  if (!history[mode].length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = `<h1>${m.title}</h1><p>${m.desc}</p><div class="chips"></div>`;
    m.examples.forEach(t => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = t.length > 40 ? t.slice(0,40) + "…" : t;
      b.onclick = () => { input.value = t; fit(); input.focus(); };
      e.querySelector(".chips").appendChild(b);
    });
    chat.appendChild(e);
  } else {
    history[mode].forEach(h => bubble(h.role, h.content, h.thinking));
  }
}

async function ask(text){
  if (!API_URL) {                       // 데모 응답
    await new Promise(r => setTimeout(r, 800));
    const demo = {
      code:  { answer:"데모 응답입니다. 모델 서버를 연결하면 실제 코드가 나옵니다.\n\n```python\ndef hello():\n    return \"Persona OS\"\n```" },
      think: { thinking:"1. 문제를 나눈다\n2. 가능한 방법을 비교한다\n3. 답을 검증한다", answer:"데모 응답입니다. 모델 서버를 연결하면 실제 추론 결과가 나옵니다." },
      fact:  { answer:"데모 응답입니다. 모델 서버를 연결하면 문서에 근거한 답이 나옵니다." }
    };
    return demo[mode];
  }
  const res = await fetch(API_URL, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ mode, messages: history[mode].map(({role,content}) => ({role,content})) })
  });
  if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
  return res.json();
}

async function submit(){
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; send.disabled = true;
  const cur = mode;
  history[cur].push({ role:"user", content:text });
  input.value = ""; fit(); render();
  const wait = bubble("ai", ""); wait.querySelector(".bubble").innerHTML = '<span class="dots"><b></b><b></b><b></b></span>';
  try {
    const r = await ask(text);
    history[cur].push({ role:"assistant", content:r.answer || "", thinking:r.thinking || "" });
  } catch (err) {
    history[cur].push({ role:"assistant", content:"답변을 가져오지 못했습니다. API_URL과 서버 상태를 확인하고 다시 보내 주세요.\n(" + err.message + ")" });
  }
  busy = false; send.disabled = false;
  if (cur === mode) render();
}

function fit(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }

Object.keys(MODES).forEach(k => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "tab"; b.role = "tab"; b.dataset.mode = k; b.textContent = MODES[k].label;
  b.onclick = () => { mode = k; render(); input.focus(); };
  $("tabs").appendChild(b);
});
$("reset").onclick = () => { history[mode] = []; render(); };
$("form").addEventListener("submit", e => { e.preventDefault(); submit(); });
input.addEventListener("input", fit);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
});
render();
</script>
</body>
</html>
